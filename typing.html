<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Practice</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--fg:#eef0f4;--mut:#8b93a3;--acc:#f5b942;--ok:#4cc38a;--bad:#e5645f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px}h1{font-size:2.4rem;margin:0 0 8px}p.sub{color:var(--mut);margin:0 0 32px}
.card{background:var(--card);border-radius:16px;padding:28px}
#target{font:1.35rem/1.8 monospace;margin-bottom:16px;word-break:break-word}
.ok{color:var(--ok)}.bad{color:var(--bad);text-decoration:underline}.cur{background:#2f3542}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2f3542;background:#0f1115;color:var(--fg);font:1.1rem monospace}
button{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--acc);color:#1a1405;font-weight:600;margin-top:14px}
.stats{display:flex;gap:24px;color:var(--mut);margin-top:16px}.stats b{color:var(--fg);font-size:1.3rem}
</style></head><body><main>
<h1>Typing Practice</h1>
<p class="sub">Type the sentence and press Enter. Speed and accuracy are calculated by C++ running in your browser via WebAssembly.</p>
<div class="card" id="card"><p>Loading game engine…</p></div>
</main>
<script src="typing_practice.js"></script>
<script>
createModule().then(M=>{
  const card=document.getElementById('card'); let g=new M.WebTyping();
  function next(){
    if(!g.nextSentence()){
      card.innerHTML=`<h2>Finished</h2><div class="stats"><div>Avg accuracy<br><b>${g.avgAccuracy().toFixed(1)}%</b></div><div>Avg speed<br><b>${g.avgWpm().toFixed(1)} WPM</b></div><div>Best<br><b>${g.bestWpm().toFixed(1)} WPM</b></div></div><button id="again">Play again</button>`;
      document.getElementById('again').onclick=()=>{g.delete();g=new M.WebTyping();next();}; return;
    }
    const target=g.sentence(); let start=null;
    card.innerHTML=`<div id="target"></div><input id="in" autocomplete="off" spellcheck="false" placeholder="Start typing…"><div class="stats" id="st"></div>`;
    const t=document.getElementById('target'),inp=document.getElementById('in'),st=document.getElementById('st');
    const draw=()=>{const v=inp.value;t.innerHTML=[...target].map((c,i)=>{
      const cls=i<v.length?(v[i]===c?'ok':'bad'):(i===v.length?'cur':'');return `<span class="${cls}">${c===' '?'&nbsp;':c}</span>`;}).join('');};
    draw(); inp.focus();
    inp.oninput=()=>{ if(start===null) start=performance.now(); draw(); };
    inp.onkeydown=e=>{ if(e.key!=='Enter'||start===null) return;
      const secs=(performance.now()-start)/1000; g.submit(inp.value,secs); inp.disabled=true;
      st.innerHTML=`<div>Accuracy<br><b>${g.accuracy().toFixed(1)}%</b></div><div>Speed<br><b>${g.wpm().toFixed(1)} WPM</b></div>`;
      const b=document.createElement('button'); b.textContent='Next'; b.onclick=next; card.appendChild(b); b.focus(); };
  }
  next();
});
</script></body></html>
